name: Incident Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run all tests with coverage
        run: |
          python -m pytest tests/ -v --cov=src/ --cov-report=term-missing --cov-report=xml --tb=short
        env:
          # Prevent API-dependent tests from hitting real services
          GROQ_API_KEY: ""
          HINDSIGHT_API_KEY: ""
          GITHUB_TOKEN: ""

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Lint source code
        run: |
          flake8 src/ tests/ --max-line-length=100 --count --statistics
        continue-on-error: true
