apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: paystream-prod
  labels:
    app: notification-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notification-worker
  template:
    metadata:
      labels:
        app: notification-worker
    spec:
      containers:
        - name: notification-worker
          image: paystream/notification-worker:v1.8.2
          ports:
            - containerPort: 9090
          env:
            - name: KAFKA_BROKER
              value: "kafka-02:9092"
            - name: CONSUMER_GROUP
              value: "email-workers"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 20
