apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: paystream-prod
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: paystream/api-gateway:v3.1.0
          ports:
            - containerPort: 443
          env:
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-processor-v2:8080"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:4000"
            - name: UPSTREAM_TIMEOUT_MS
              value: "10000"
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
